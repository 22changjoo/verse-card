<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" id="metaTheme" content="#f5f2e8">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<title>보낸 내역</title>
<script src="js/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/library.css">
</head>
<body class="library-page history-page">
<header class="appbar">
  <a class="icon-btn back-btn" href="index.html" aria-label="카드 만들기로 돌아가기">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
  </a>
  <div class="appbar-actions">
    <button type="button" class="icon-btn" id="themeToggle" aria-label="화면 밝기 바꾸기">
      <svg class="i-moon" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="i-sun" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>
<div class="lib-head">
  <h1 class="lib-title">보낸 내역</h1>
  <p class="notice">카드를 저장·공유·인쇄할 때마다 한 줄씩 남아요. 같은 분께 같은 말씀을 또 보내지 않았는지 확인할 때 쓰세요. 이 내용은 이 기기에만 저장되고, 구글 드라이브 동기화를 켠 경우에만 목회자님의 드라이브로 옮겨져요.</p>
</div>

<main class="lib">
  <div class="lib-tools">
    <label class="sr-only" for="histSearch">검색</label>
    <input id="histSearch" type="text" autocomplete="off" placeholder="이름이나 말씀으로 찾기 (예: 홍길동, 시편 23)">
    <p class="hint" id="histSummary" aria-live="polite"></p>
  </div>

  <ul class="verse-list" id="histList"></ul>

  <section class="backup">
    <h2 class="section-title">정리</h2>
    <div class="backup-btns">
      <button type="button" class="btn" id="histClear">내역 모두 지우기</button>
    </div>
    <div id="syncPanel" style="margin-top:16px"></div>
  </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="js/storage.js"></script>
<script src="js/library.js"></script>
<script src="js/history.js"></script>
<script src="js/sync-core.js"></script>
<script src="js/drive.js"></script>
<script src="js/sync-config.js"></script>
<script src="js/sync.js"></script>
<script src="js/history-page.js"></script>
<script>document.getElementById("themeToggle").addEventListener("click",function(){VerseTheme.toggle();});</script>
<script src="js/pwa.js"></script>
</body>
</html>
